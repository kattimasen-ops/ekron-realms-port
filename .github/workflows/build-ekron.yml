name: Build Ekron Realms FPS (RK3326 / ARM64 - Max Performance)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-aarch64:
    runs-on: ubuntu-22.04
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Build-Skript schreiben (falls nicht vorhanden)
        run: |
          mkdir -p .github/scripts
          if [ ! -f .github/scripts/build-ekron.sh ]; then
            echo "Build-Skript fehlt – bitte anlegen!"
            exit 1
          fi

      - name: Cross-Compile im FPC 3.2.2 (Focal) Container
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            freepascal/fpc:3.2.2-focal-full \
            bash /work/.github/scripts/build-ekron.sh

      - name: Build-Artefakte hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ekron-realms-rk3326-aarch64
          path: out/ekron-realms/
          if-no-files-found: error
